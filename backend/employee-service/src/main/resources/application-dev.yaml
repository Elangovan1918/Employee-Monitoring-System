spring:
  application:
    name: employee-service

  datasource:
    url: jdbc:mysql://localhost:3306/employee_monitoring_dev
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration