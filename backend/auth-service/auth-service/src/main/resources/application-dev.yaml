spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_monitoring_dev
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:replace-this-with-a-long-development-secret-key-123456789}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

